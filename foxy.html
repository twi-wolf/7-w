<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>FOXY-BOT | Deploy Options</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ── FOXY ORANGE THEME ── */
        :root {
            --primary-orange: #ff7b00;
            --dark-orange: #e06600;
            --light-orange: #ff9a33;
            --glow-orange: rgba(255, 123, 0, 0.4);
            --black: #0b0b0b;
            --dark-card: #141414;
            --gray-panel: #1e1e1e;
            --light-gray: #aaaaaa;
            --white: #f5f5f5;

            /* platform colours (adjusted) */
            --heroku-purple: #6762a6;
            --railway-purple: #7C3AED;
            --render-blue: #46E3B7;
            --replit-blue: #808bed;
            --wolfhost-orange: #ff7b00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--black);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
            line-height: 1.5;
        }

        /* ── particles ── */
        #particles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            background-color: var(--primary-orange);
            border-radius: 50%;
            pointer-events: none;
            animation: float 22s infinite alternate ease-in-out;
        }
        @keyframes float {
            0%   { transform: translate(0, 0) scale(0.8); opacity: 0.2; }
            100% { transform: translate(80px, -60px) scale(1.4); opacity: 0.5; }
        }

        .container {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* ── header ── */
        .header {
            text-align: center;
            margin-bottom: 18px;
            padding: 16px 12px;
            background: rgba(255, 123, 0, 0.07);
            border-radius: 20px;
            border: 1px solid rgba(255, 123, 0, 0.2);
            backdrop-filter: blur(4px);
        }
        .fox-icon {
            font-size: 32px;
            color: var(--primary-orange);
            margin-bottom: 4px;
            animation: pulse 2.2s infinite;
        }
        .header h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--primary-orange), var(--light-orange));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 18px var(--glow-orange);
            margin-bottom: 2px;
        }
        .subtitle {
            color: var(--light-gray);
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .subtitle i {
            color: var(--primary-orange);
            margin: 0 4px;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        /* ── deploy card ── */
        .deploy-card {
            background: rgba(20, 20, 20, 0.96);
            border-radius: 24px;
            padding: 24px 20px 20px;
            border: 1px solid rgba(255, 123, 0, 0.25);
            box-shadow: 0 16px 40px rgba(255, 123, 0, 0.15);
            backdrop-filter: blur(12px);
        }
        .card-header {
            text-align: center;
            margin-bottom: 18px;
        }
        .card-header h2 {
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--primary-orange);
            letter-spacing: 0.5px;
        }
        .card-header p {
            color: var(--light-gray);
            font-size: 0.9rem;
            margin-top: 2px;
        }

        /* ── form ── */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            color: var(--light-orange);
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: var(--gray-panel);
            border: 1.5px solid var(--primary-orange);
            border-radius: 14px;
            color: var(--white);
            font-size: 1rem;
            transition: 0.25s ease;
            caret-color: var(--primary-orange);
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: var(--light-orange);
            box-shadow: 0 0 0 4px rgba(255, 123, 0, 0.2);
        }
        .github-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-orange);
            font-size: 1.4rem;
        }

        /* ── platform grid ── */
        .platform-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 18px 0 6px;
        }
        .platform-button {
            padding: 14px 6px;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: white;
            white-space: nowrap;
            background: var(--gray-panel);
            border: 1px solid transparent;
        }
        .platform-button i {
            font-size: 1.1rem;
        }

        /* brand buttons */
        .heroku-btn    { background: linear-gradient(145deg, #5b4f8a, #7a5fc7); }
        .heroku-btn:hover { background: linear-gradient(145deg, #7a5fc7, #9b7fff); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(103, 98, 166, 0.4); }

        .wolfhost-btn  { background: linear-gradient(145deg, #cc6600, #ff7b00); }
        .wolfhost-btn:hover { background: linear-gradient(145deg, #ff7b00, #ff9933); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(255, 123, 0, 0.5); }

        .railway-btn   { background: linear-gradient(145deg, #1f1b3a, #7C3AED); }
        .railway-btn:hover { background: linear-gradient(145deg, #7C3AED, #9F67FF); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(124, 58, 237, 0.4); }

        .render-btn    { background: linear-gradient(145deg, #1a2a33, #46E3B7); }
        .render-btn:hover { background: linear-gradient(145deg, #46E3B7, #7AFFD9); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(70, 227, 183, 0.4); }

        .replit-btn    { background: linear-gradient(145deg, #0E1525, #808bed); grid-column: span 2; }
        .replit-btn:hover { background: linear-gradient(145deg, #808bed, #a0b0ff); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(128, 139, 237, 0.4); }

        .platform-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .fa-spin { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ── info box ── */
        .info-text {
            margin-top: 20px;
            padding: 14px 16px;
            background: rgba(255, 123, 0, 0.07);
            border-radius: 14px;
            border-left: 4px solid var(--primary-orange);
            color: #bbbbbb;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .info-text i {
            color: var(--primary-orange);
            margin-right: 6px;
            width: 18px;
        }
        .info-text strong {
            color: var(--light-orange);
            font-weight: 600;
        }

        /* ── responsive ── */
        @media (max-width: 500px) {
            body { padding: 8px; align-items: flex-start; }
            .container { max-width: 100%; }
            .header { padding: 12px 8px; margin-bottom: 14px; }
            .header h1 { font-size: 2rem; }
            .fox-icon { font-size: 26px; }
            .deploy-card { padding: 18px 14px; }
            .card-header h2 { font-size: 1.6rem; }
            .platform-grid { gap: 8px; }
            .platform-button { padding: 12px 4px; font-size: 0.8rem; gap: 4px; }
            .platform-button i { font-size: 0.9rem; }
            .input-wrapper input { padding: 12px 14px 12px 42px; font-size: 0.9rem; }
            .info-text { font-size: 0.78rem; padding: 12px; }
        }
        @media (max-width: 380px) {
            .header h1 { font-size: 1.7rem; }
            .platform-button { font-size: 0.7rem; }
            .platform-button i { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div id="particles"></div>

    <div class="container">
        <div class="header">
            <div class="fox-icon">
                <i class="fas fa-fox"></i>
            </div>
            <h1>FOXY-BOT</h1>
            <div class="subtitle">
                <i class="fas fa-bolt"></i> Advanced WhatsApp Bot by WOLVAREX
            </div>
        </div>

        <div class="deploy-card">
            <div class="card-header">
                <h2>Deploy</h2>
                <p>Choose your platform</p>
            </div>

            <form id="deployForm">
                <div class="form-group">
                    <label for="githubUsername">
                        <i class="fas fa-user-astronaut"></i> GitHub Username
                    </label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="githubUsername" 
                            placeholder="e.g. WOLVAREX"
                            required
                        />
                        <div class="github-icon">
                            <i class="fab fa-github"></i>
                        </div>
                    </div>
                </div>

                <div class="platform-grid">
                    <button type="submit" class="platform-button heroku-btn" id="deployHerokuBtn" data-platform="heroku">
                        <i class="fab fa-heroku"></i> Heroku
                    </button>

                    <button type="submit" class="platform-button wolfhost-btn" id="deployWolfHostBtn" data-platform="wolfhost">
                        <i class="fas fa-cloud-upload-alt"></i> WolfHost
                    </button>

                    <button type="submit" class="platform-button railway-btn" id="deployRailwayBtn" data-platform="railway">
                        <i class="fas fa-train"></i> Railway
                    </button>

                    <button type="submit" class="platform-button render-btn" id="deployRenderBtn" data-platform="render">
                        <i class="fas fa-cloud-sun"></i> Render
                    </button>

                    <button type="submit" class="platform-button replit-btn" id="deployReplitBtn" data-platform="replit">
                        <i class="fas fa-code"></i> Replit
                    </button>
                </div>
            </form>

            <div class="info-text">
                <i class="fas fa-key"></i> Set <strong>SESSION_ID</strong> in environment variables after redirect.<br>
                <i class="fas fa-hourglass-half"></i> Deployment takes 2–3 minutes.
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ── particles ──
            function createParticles() {
                const container = document.getElementById('particles');
                const count = Math.min(22, Math.floor(window.innerWidth / 28));
                container.innerHTML = '';
                for (let i = 0; i < count; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.top = Math.random() * 100 + '%';
                    const size = 3 + Math.random() * 5;
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    p.style.opacity = 0.15 + Math.random() * 0.35;
                    p.style.animationDelay = (Math.random() * 12) + 's';
                    p.style.animationDuration = (18 + Math.random() * 22) + 's';
                    container.appendChild(p);
                }
            }

            // ── DOM refs ──
            const form = document.getElementById('deployForm');
            const usernameInput = document.getElementById('githubUsername');
            const herokuBtn = document.getElementById('deployHerokuBtn');
            const wolfhostBtn = document.getElementById('deployWolfHostBtn');
            const railwayBtn = document.getElementById('deployRailwayBtn');
            const renderBtn = document.getElementById('deployRenderBtn');
            const replitBtn = document.getElementById('deployReplitBtn');
            const allButtons = [herokuBtn, wolfhostBtn, railwayBtn, renderBtn, replitBtn];

            // ── local storage ──
            const stored = localStorage.getItem('foxy_github_username');
            if (stored) usernameInput.value = stored;

            usernameInput.addEventListener('input', function() {
                localStorage.setItem('foxy_github_username', this.value.trim());
            });

            // ── platform URLs (FOXY-BOT repo) ──
            const REPO = 'https://github.com/WOLVAREX/FOXY';
            const platformUrls = {
                heroku:   `https://heroku.com/deploy?template=${REPO}`,
                wolfhost: 'https://host.xwolf.space',   // WolfHost panel
                railway:  `https://railway.app/new/template?template=${REPO}`,
                render:   `https://render.com/deploy?repo=${REPO}`,
                replit:   `https://replit.com/github/WOLVAREX/FOXY`
            };

            // ── deploy handler ──
            function handleDeploy(platform, event) {
                event.preventDefault();
                const username = usernameInput.value.trim();
                if (!username) {
                    alert('Please enter your GitHub username');
                    return;
                }

                // disable all buttons & show spinner on clicked
                allButtons.forEach(btn => btn.disabled = true);
                const clicked = event.target.closest('button');
                const originalHtml = clicked.innerHTML;
                clicked.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Redirecting...`;

                // redirect after short delay
                setTimeout(() => {
                    window.location.href = platformUrls[platform];
                }, 700);
            }

            // ── attach events ──
            herokuBtn.addEventListener('click',   (e) => handleDeploy('heroku', e));
            wolfhostBtn.addEventListener('click', (e) => handleDeploy('wolfhost', e));
            railwayBtn.addEventListener('click',  (e) => handleDeploy('railway', e));
            renderBtn.addEventListener('click',   (e) => handleDeploy('render', e));
            replitBtn.addEventListener('click',   (e) => handleDeploy('replit', e));

            // prevent default form submission
            form.addEventListener('submit', (e) => e.preventDefault());

            // ── init ──
            createParticles();
            window.addEventListener('resize', createParticles);
        })();
    </script>
</body>
</html>
